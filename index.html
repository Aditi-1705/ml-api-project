<!DOCTYPE html>
<html>
<head>
    <title>Breast Cancer Predictor</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 10px;
            width: 50%;
            margin: auto;
        }

        textarea {
            width: 90%;
            height: 100px;
            border-radius: 5px;
            padding: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Breast Cancer Prediction</h2>

    


<!-- UI elements -->
<textarea id="input"></textarea>
<button onclick="predict()">Predict</button>
<p id="result"></p>

<!-- Script must be HERE -->
<script>
function predict() {
    console.log("Trying API...");

    let input = document.getElementById("input").value;

    let features;
    try {
        features = JSON.parse(input);
    } catch (e) {
        document.getElementById("result").innerText = "Invalid input format";
        return;
    }

    fetch("https://ml-api-project-cquw.onrender.com/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ features: features })
    })
    .then(res => {
        console.log("Response received:", res);
        return res.json();
    })
    .then(data => {
        console.log("Data:", data);

        document.getElementById("result").innerText =
            "Prediction: " + data.result + " | Confidence: " + data.confidence + "%";
    })
    .catch(err => {
        console.log("ERROR:", err);
        document.getElementById("result").innerText =
            "Backend not reachable. Wait 30 sec & try again.";
    });
}
</script>

</body>
</html>
