<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #667eea;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #5a67d8;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #status {
            margin-top: 10px;
            color: orange;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Breast Cancer Prediction</h2>

    <textarea id="input">
[14.0,20.0,90.0,600.0,0.1,0.2,0.15,0.1,0.2,0.06,0.3,1.2,2.0,20.0,0.01,0.03,0.04,0.02,0.02,0.003,16.0,25.0,100.0,800.0,0.15,0.3,0.4,0.2,0.3,0.08]
    </textarea>

    <br>
    <button onclick="predict()">Predict</button>

    <p id="status"></p>
    <p id="result"></p>
</div>

<script>
async function predict() {
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    status.innerText = "⏳ Contacting server... please wait";
    result.innerText = "";

    let input = document.getElementById("input").value;
    let features;

    // Validate JSON
    try {
        features = JSON.parse(input);
    } catch (e) {
        status.innerText = "";
        result.innerText = "❌ Invalid input format";
        return;
    }

    try {
        const response = await fetch("https://ml-api-project-cquw.onrender.com/predict", {
            method: "POST",
            mode: "cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ features: features })
        });

        const data = await response.json();

        status.innerText = "✅ Response received";

        result.innerText =
            "Prediction: " + data.result +
            " | Confidence: " + data.confidence + "%";

    } catch (error) {
        console.log(error);

        status.innerText = "⚠️ Server is waking up (Render free tier)";
        result.innerText = "Try again in 20–30 seconds";
    }
}
</script>

</body>
</html>
